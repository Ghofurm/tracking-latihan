<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Pencatat latihan calisthenics mingguan, progres, dan saran naik level.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f3f0e8">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#111713">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='8'%20fill='%232f6b4f'/%3E%3Cpath%20d='M6%209h20M11%209v4l5%206%205-6V9M16%2019v6'%20fill='none'%20stroke='white'%20stroke-width='2'%20stroke-linecap='round'%20stroke-linejoin='round'/%3E%3C/svg%3E">
  <title>Calisthenics Tracker</title>
  <link rel="stylesheet" href="style.css">
  <script src="data.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#app-main">Lewati ke konten</a>

  <div class="app-shell">
    <header class="app-header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 7h24"></path>
            <path d="M10 7v5l6 7 6-7V7"></path>
            <path d="M16 19v6"></path>
          </svg>
        </span>
        <span class="brand-text">
          <span class="brand-name">Calisthenics</span>
          <span class="brand-sub">Tracker</span>
        </span>
      </div>
      <span class="app-version">v1.0</span>
    </header>

    <main id="app-main" tabindex="-1"></main>

    <nav class="bottom-nav" id="bottom-nav" aria-label="Navigasi utama">
      <button class="nav-btn" type="button" data-view="today">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="5" width="18" height="16" rx="3"></rect>
          <path d="M8 3v4M16 3v4M3 10h18"></path>
          <path d="M8 14h2M14 14h2M8 17.5h2"></path>
        </svg>
        <span>Hari Ini</span>
      </button>
      <button class="nav-btn" type="button" data-view="history">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 12a9 9 0 1 0 2.8-6.5"></path>
          <path d="M3 4v5h5"></path>
          <path d="M12 7.5V12l3 2"></path>
        </svg>
        <span>Riwayat</span>
      </button>
      <button class="nav-btn" type="button" data-view="progress">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 20V4"></path>
          <path d="M4 20h16"></path>
          <path d="M8 17v-5M13 17V7M18 17v-8"></path>
        </svg>
        <span>Progres</span>
      </button>
      <button class="nav-btn" type="button" data-view="settings">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 7h16M4 17h16"></path>
          <circle cx="9" cy="7" r="2.2" fill="currentColor" stroke="none"></circle>
          <circle cx="15" cy="17" r="2.2" fill="currentColor" stroke="none"></circle>
        </svg>
        <span>Pengaturan</span>
      </button>
    </nav>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>

  <noscript>
    <div class="noscript-warning">Aplikasi ini membutuhkan JavaScript agar bisa mencatat latihan.</div>
  </noscript>
</body>
</html>
